gesdinet_jwt_refresh_token:
    refresh_token_class: App\Entity\RefreshToken
    ttl: '%env(int:JWT_REFRESH_TOKEN_TTL)%'
    single_use: true
    ttl_update: false
    single_use_ttl_update: true
    hash_tokens:
        enabled: true
        # Rewrite cleartext rows on first use so enabling hashing does not force re-login.
        accept_stored_in_the_clear: true
    reuse_detection:
        enabled: true
        # cache.app must be shared across replicas for replay detection to work in a fleet.
    api_platform:
        enabled: true
