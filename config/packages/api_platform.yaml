api_platform:
    title: Znamky API
    version: 1.0.0
    description: |
        JSON API for Znamky.

        Authenticate with `POST /api/login` (verified users only), then send
        `Authorization: Bearer <token>`. Refresh via `POST /api/token/refresh`.

        Validation errors for auth request DTOs return **422** with a
        `ValidationFailed` body (`title`, `detail`, `violations[]`).

        GraphQL (read-only stamp catalog): `POST /api/graphql`, IDE at
        `/api/graphql/graphiql`.

        Human docs: `docs/auth.md` (auth), `docs/stamps.md` (stamp catalog).
    defaults:
        stateless: true
        cache_headers:
            vary: ['Content-Type', 'Authorization', 'Origin']
    graphql:
        graphiql:
            enabled: true
