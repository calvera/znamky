framework:
    rate_limiter:
        # Public auth endpoints that send mail or create accounts (keyed by IP by default).
        auth_email:
            policy: sliding_window
            limit: 10
            interval: '15 minutes'

        # Token submit endpoints (verify-email / reset-password).
        auth_token:
            policy: sliding_window
            limit: 20
            interval: '15 minutes'

        # Login throttling: per username+IP (local) and per IP (global).
        username_ip_login:
            policy: token_bucket
            limit: 5
            rate: { interval: '5 minutes' }

        ip_login:
            policy: sliding_window
            limit: 50
            interval: '15 minutes'

when@test:
    framework:
        rate_limiter:
            # Keep production-like policies but raise ceilings so the suite can share one IP.
            # AuthRateLimitTest clears the pool and uses these exact limits.
            auth_email:
                policy: fixed_window
                limit: 5
                interval: '1 hour'

            auth_token:
                policy: fixed_window
                limit: 5
                interval: '1 hour'

            username_ip_login:
                policy: fixed_window
                limit: 5
                interval: '1 hour'

            ip_login:
                policy: fixed_window
                limit: 20
                interval: '1 hour'
